name: Xeroww CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Backend Verification (Tests, Lint, Security Audit)
  # ============================================================================
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest-cov ruff

      - name: Static Analysis & Lint (Ruff)
        run: |
          ruff check api --select=E,F,W --ignore=E501,E402

      - name: Run Backend Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          JWT_SECRET_KEY: ci_testing_secret_key_very_long_and_secure_12345
          RATE_LIMIT_UNAUTH_RPM: 1000
          RATE_LIMIT_AUTH_RPM: 1000
        run: |
          pytest api/tests -v

  # ============================================================================
  # Job 2: Frontend Verification (Typecheck, Lint & Production Build)
  # ============================================================================
  frontend-quality:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: dashboard
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Production Vite Build
        working-directory: dashboard
        run: npm run build

  # ============================================================================
  # Job 3: Container & Infrastructure Validation
  # ============================================================================
  docker-validation:
    name: Docker Compose & Image Validation
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Build Backend Image
        run: |
          docker build -t xeroww-backend:ci -f api/Dockerfile .

      - name: Build Frontend Image
        run: |
          docker build -t xeroww-frontend:ci -f dashboard/Dockerfile .
