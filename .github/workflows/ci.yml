name: Xeroww Private Beta Release Gate

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Backend verification
  # ============================================================================
  backend-quality:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest-cov ruff

      - name: Backend lint
        run: ruff check api --select=E,F,W --ignore=E501,E402,E741

      - name: Backend tests
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./test_ci.db
          JWT_SECRET_KEY: ci_testing_secret_key_very_long_and_secure_12345
          RATE_LIMIT_UNAUTH_RPM: 1000
          RATE_LIMIT_AUTH_RPM: 1000
        run: python -m pytest api/tests

  # ============================================================================
  # Job 2: Frontend verification
  # ============================================================================
  frontend-quality:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: dashboard
        run: npm ci

      - name: Frontend tests
        working-directory: dashboard
        run: npm run test:run

      - name: Frontend lint
        working-directory: dashboard
        run: npm run lint

      - name: TypeScript check
        working-directory: dashboard
        run: npx tsc -b --pretty false

      - name: Production frontend build
        working-directory: dashboard
        run: npm run build

  # ============================================================================
  # Job 3: PostgreSQL migration and real-stack deployment gate
  # ============================================================================
  deployment-gate:
    name: PostgreSQL Migration & Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Ensure Clean Disposable Environment
        run: docker compose down --volumes --remove-orphans

      - name: Build and Start Docker Compose Stack
        run: |
          set -euo pipefail
          docker compose up --detach --build --wait --wait-timeout 240

      - name: Verify PostgreSQL Migration Applied
        run: |
          set -euo pipefail
          test "$(docker inspect --format='{{.State.ExitCode}}' xeroww-migrate)" = "0"
          docker compose exec -T backend alembic -c /app/alembic.ini current | tee /tmp/alembic-current.txt
          grep -q '(head)' /tmp/alembic-current.txt

      - name: Show Running Service State
        run: docker compose ps --all

      - name: Smoke Test Backend Health
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-connrefused \
            http://localhost:8000/health | tee /tmp/backend-health.json
          grep -q '"status":"healthy"' /tmp/backend-health.json

      - name: Smoke Test Frontend Container
        run: |
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-connrefused \
            --output /dev/null http://localhost:3000/

      - name: Smoke Test Nginx Application Route
        run: |
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-connrefused \
            --output /dev/null http://localhost/

      - name: Smoke Test Proxied API Routes
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-connrefused \
            http://localhost/api/health | tee /tmp/proxied-health.json
          grep -q '"status":"healthy"' /tmp/proxied-health.json
          curl --fail --show-error --silent http://localhost/api/stocks --output /tmp/stocks.json
          grep -q 'RELIANCE.NS' /tmp/stocks.json
          curl --fail --show-error --silent http://localhost/metrics --output /tmp/metrics.txt
          grep -q 'http_requests_total' /tmp/metrics.txt

      - name: Capture Docker Diagnostics
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --tail=200 || true

      - name: Remove Temporary Docker Resources
        if: always()
        run: docker compose down --volumes --remove-orphans
