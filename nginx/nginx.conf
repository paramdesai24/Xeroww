# ==============================================================================
# Xeroww Edge Reverse Proxy — Nginx Configuration
# Request path:
#   Browser -> Nginx (:80) ->
#       /api/*      -> FastAPI Backend (:8000)
#       /ws/*       -> FastAPI WebSocket (:8000) with Connection Upgrade
#       /metrics    -> Prometheus Metrics (:8000)
#       /*          -> React SPA Dashboard (:80)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request timing and trace IDs
    log_format xeroww_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               'rt=$request_time uct="$upstream_connect_time" '
                               'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log xeroww_combined;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream backend_cluster {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_cluster {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # ----------------------------------------------------------------------
        # REST API Routes
        # ----------------------------------------------------------------------
        location /api/ {
            # Strip /api prefix when passing to backend
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # WebSocket Streaming Connection Upgrade
        # ----------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ----------------------------------------------------------------------
        # Prometheus Metrics Route (Internal monitoring access)
        # ----------------------------------------------------------------------
        location /metrics {
            proxy_pass http://backend_cluster/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ----------------------------------------------------------------------
        # Frontend Single Page Application
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
