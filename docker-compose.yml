services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 — Relational store for user, portfolio, watchlist, and journal
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: xeroww-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xeroww}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xeroww_secret}
      POSTGRES_DB: ${POSTGRES_DB:-xeroww_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - xeroww-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xeroww} -d ${POSTGRES_DB:-xeroww_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Redis 7 — High-performance short-lived cache & rate limiting
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: xeroww-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - xeroww-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------------------------------
  # Backend — FastAPI Institutional Market Intelligence Platform
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: xeroww-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-xeroww}:${POSTGRES_PASSWORD:-xeroww_secret}@postgres:5432/${POSTGRES_DB:-xeroww_db}
      AUTO_CREATE_TABLES: "false"
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_to_a_secure_random_key_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
      CACHE_QUOTE_TTL: 15
      CACHE_OHLC_TTL: 300
      CACHE_BREADTH_TTL: 60
      RATE_LIMIT_UNAUTH_RPM: 60
      RATE_LIMIT_AUTH_RPM: 180
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - xeroww-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Database migration - one-shot Alembic upgrade before backend startup
  # ----------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: xeroww-migrate
    restart: "no"
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-xeroww}:${POSTGRES_PASSWORD:-xeroww_secret}@postgres:5432/${POSTGRES_DB:-xeroww_db}
      AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xeroww-network

  # ----------------------------------------------------------------------------
  # Frontend — React + TypeScript Institutional Terminal UI
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: xeroww-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - xeroww-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Nginx reverse proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: xeroww-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - xeroww-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Prometheus — Time-series Metrics Engine
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: xeroww-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - xeroww-network

  # ----------------------------------------------------------------------------
  # Grafana — Visual Operational Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: xeroww-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - xeroww-network

networks:
  xeroww-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
