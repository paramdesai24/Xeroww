x-kafka-common: &kafka-common
  image: apache/kafka:4.3.1
  restart: unless-stopped
  networks:
    - xeroww-network
  healthcheck:
    test: ["CMD-SHELL", "bash -ec ': > /dev/tcp/localhost/9092'"]
    interval: 15s
    timeout: 5s
    retries: 12
    start_period: 120s

x-kafka-environment: &kafka-environment
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS: 10000
  KAFKA_CONTROLLER_QUORUM_FETCH_TIMEOUT_MS: 20000
  KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS: 5000
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 — Relational store for user, portfolio, watchlist, and journal
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: xeroww-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xeroww}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xeroww_secret}
      POSTGRES_DB: ${POSTGRES_DB:-xeroww_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - xeroww-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xeroww} -d ${POSTGRES_DB:-xeroww_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Redis 7 — High-performance short-lived cache & rate limiting
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: xeroww-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - xeroww-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------------------------------
  # Kafka 4 KRaft cluster - three combined broker/controller nodes
  # ----------------------------------------------------------------------------
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    container_name: xeroww-kafka-1
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    ports:
      - "${KAFKA_BROKER_1_PORT:-19092}:9094"

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    container_name: xeroww-kafka-2
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    ports:
      - "${KAFKA_BROKER_2_PORT:-29092}:9094"

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    container_name: xeroww-kafka-3
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    ports:
      - "${KAFKA_BROKER_3_PORT:-39092}:9094"

  kafka-init:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: xeroww-kafka-init
    restart: "no"
    command: ["python", "-m", "api.streaming.admin"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_MARKET_DATA_TOPIC: market-data
      KAFKA_TOPIC_PARTITIONS: 6
      KAFKA_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_REQUEST_TIMEOUT_MS: 30000
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - xeroww-network

  market-data-worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: xeroww-market-data-worker
    restart: unless-stopped
    command: ["python", "-m", "api.streaming.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      CACHE_QUOTE_TTL: 15
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_MARKET_DATA_TOPIC: market-data
      KAFKA_PRODUCER_CLIENT_ID: xeroww-live-market-data-producer
      KAFKA_REQUEST_TIMEOUT_MS: 30000
      KAFKA_DELIVERY_TIMEOUT_MS: 30000
      MARKET_DATA_WORKER_INTERVAL_SECONDS: ${MARKET_DATA_WORKER_INTERVAL_SECONDS:-60}
      MARKET_DATA_WORKER_SYMBOLS: ${MARKET_DATA_WORKER_SYMBOLS:-RELIANCE.NS,TCS.NS,INFY.NS,HDFCBANK.NS,ICICIBANK.NS}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - xeroww-network

  spark-master:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: xeroww-spark-master
    restart: unless-stopped
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      SPARK_DAEMON_MEMORY: 192m
    ports:
      - "${SPARK_MASTER_UI_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec ': > /dev/tcp/spark-master/7077'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - xeroww-network

  spark-worker-1:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: xeroww-spark-worker-1
    restart: unless-stopped
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - --cores
      - "1"
      - --memory
      - 640m
      - spark://spark-master:7077
    environment:
      SPARK_DAEMON_MEMORY: 192m
      SPARK_WORKER_DIR: /opt/spark/work
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - spark_worker_1_data:/opt/spark/work
      - spark_checkpoints:/opt/spark/checkpoints
      - spark_output:/opt/spark/output
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - xeroww-network

  spark-worker-2:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: xeroww-spark-worker-2
    restart: unless-stopped
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - --cores
      - "1"
      - --memory
      - 640m
      - spark://spark-master:7077
    environment:
      SPARK_DAEMON_MEMORY: 192m
      SPARK_WORKER_DIR: /opt/spark/work
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - spark_worker_2_data:/opt/spark/work
      - spark_checkpoints:/opt/spark/checkpoints
      - spark_output:/opt/spark/output
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - xeroww-network

  spark-streaming:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: xeroww-spark-streaming
    restart: unless-stopped
    hostname: spark-streaming
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      - --conf
      - spark.executor.instances=2
      - --conf
      - spark.executor.cores=1
      - --conf
      - spark.executor.memory=512m
      - --conf
      - spark.cores.max=2
      - --conf
      - spark.driver.memory=512m
      - --conf
      - spark.driver.host=spark-streaming
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - --conf
      - spark.driver.port=39000
      - --conf
      - spark.driver.blockManager.port=39001
      - --conf
      - spark.sql.shuffle.partitions=2
      - --conf
      - spark.network.timeout=300s
      - --conf
      - spark.executor.heartbeatInterval=30s
      - --conf
      - spark.jars.ivy=/opt/spark/ivy
      - /app/spark/streaming_job.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_MARKET_DATA_TOPIC: market-data
      SPARK_KAFKA_CONSUMER_GROUP: xeroww-spark-market-data
      SPARK_CHECKPOINT_ROOT: /opt/spark/checkpoints
      SPARK_OUTPUT_ROOT: /opt/spark/output
      SPARK_QUERY_NAME: xeroww-market-features
      SPARK_STARTING_OFFSETS: earliest
      SPARK_TRIGGER_INTERVAL: 10 seconds
      SPARK_FEATURE_WINDOW: 5 minutes
      SPARK_FEATURE_SLIDE: 1 minute
      SPARK_EVENT_WATERMARK: 2 minutes
      SPARK_LOG_LEVEL: WARN
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints
      - spark_ivy_cache:/opt/spark/ivy
      - spark_output:/opt/spark/output
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && test -f /opt/spark/checkpoints/features/metadata && test -f /opt/spark/checkpoints/rejected/metadata"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks:
      - xeroww-network

  # ----------------------------------------------------------------------------
  # Backend — FastAPI Institutional Market Intelligence Platform
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: xeroww-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-xeroww}:${POSTGRES_PASSWORD:-xeroww_secret}@postgres:5432/${POSTGRES_DB:-xeroww_db}
      AUTO_CREATE_TABLES: "false"
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_to_a_secure_random_key_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
      CACHE_QUOTE_TTL: 15
      CACHE_OHLC_TTL: 300
      CACHE_BREADTH_TTL: 60
      RATE_LIMIT_UNAUTH_RPM: 60
      RATE_LIMIT_AUTH_RPM: 180
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - xeroww-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Database migration - one-shot Alembic upgrade before backend startup
  # ----------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: xeroww-migrate
    restart: "no"
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-xeroww}:${POSTGRES_PASSWORD:-xeroww_secret}@postgres:5432/${POSTGRES_DB:-xeroww_db}
      AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xeroww-network

  # ----------------------------------------------------------------------------
  # Frontend — React + TypeScript Institutional Terminal UI
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: xeroww-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - xeroww-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Nginx reverse proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: xeroww-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - xeroww-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Prometheus — Time-series Metrics Engine
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: xeroww-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - xeroww-network

  # ----------------------------------------------------------------------------
  # Grafana — Visual Operational Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: xeroww-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - xeroww-network

networks:
  xeroww-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  kafka_1_data:
    driver: local
  kafka_2_data:
    driver: local
  kafka_3_data:
    driver: local
  spark_checkpoints:
    driver: local
  spark_ivy_cache:
    driver: local
  spark_output:
    driver: local
  spark_worker_1_data:
    driver: local
  spark_worker_2_data:
    driver: local
